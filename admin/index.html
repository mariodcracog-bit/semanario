<script>if(prompt('Clave:')!=='Semanario3230'){document.body.innerHTML='Acceso denegado';throw 0}</script><!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>ADMIN Semanario</title><style>body{margin:0;font-family:Arial;background:#f5f5f5;padding:12px}input,select,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #333;border-radius:6px;box-sizing:border-box;font-size:16px}textarea{height:160px}.btn{border:0;border-radius:8px;padding:12px;font-weight:bold;color:white;width:100%;margin-top:8px}.red{background:#b91c1c}.black{background:#222}.card{background:white;padding:12px;border-radius:10px;margin-top:12px}</style></head><body><h1>ADMIN Semanario Digital</h1><input id="titulo" placeholder="Titulo de la noticia"><select id="cat"><option>Locales</option><option>Nacionales</option><option>Inter</option><option>Deportes</option><option>Policiales</option></select><textarea id="texto" placeholder="Escriba el texto aqui..."></textarea><button class="btn red" onclick="publicar()">PUBLICAR NOTICIA</button><button class="btn black" onclick="borrarTodo()">Borrar todo y mostrar solo Historia</button><div id="estado" class="card"></div><div id="lista"></div><script>
function cargar(){let n=JSON.parse(localStorage.getItem('semanario_noticias')||'[]');document.getElementById('estado').textContent=n.length===0?'No hay noticias guardadas. Se vera la Historia fija en la pagina principal.':'Hay '+n.length+' noticias. Lo nuevo queda arriba.';document.getElementById('lista').innerHTML=n.map((x,i)=>`<div class="card"><b>${x.titulo}</b> [${x.cat}]<br><button onclick="borrarUna(${i})">Borrar esta</button></div>`).join('');}
function publicar(){let t=document.getElementById('titulo').value.trim();let tx=document.getElementById('texto').value.trim();if(!t||!tx){alert('Falta titulo o texto');return}let c=document.getElementById('cat').value;let notas=JSON.parse(localStorage.getItem('semanario_noticias')||'[]');notas.unshift({titulo:t,cat:c,texto:tx,fecha:new Date().toLocaleString('es-AR')});localStorage.setItem('semanario_noticias',JSON.stringify(notas));document.getElementById('titulo').value='';document.getElementById('texto').value='';cargar();alert('Publicado! Se mantiene lo anterior.');}
function borrarUna(i){let n=JSON.parse(localStorage.getItem('semanario_noticias')||'[]');n.splice(i,1);localStorage.setItem('semanario_noticias',JSON.stringify(n));cargar();}
function borrarTodo(){if(!confirm('¿Borrar todo y dejar solo Historia?'))return;localStorage.removeItem('semanario_noticias');cargar();}
cargar();
</script></body></html>
