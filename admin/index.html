<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Oficina Mario</title><style>body{margin:0;font-family:Arial;background:#eee;padding:12px}.card{background:white;padding:16px;border-radius:12px;max-width:600px;margin:30px auto}input,textarea{width:100%;padding:10px;margin:6px 0 12px;border:1px solid #ccc;border-radius:8px}button{background:#b91c1c;color:white;padding:12px;border:0;border-radius:8px;width:100%;font-weight:bold}</style></head><body><div id="login" class="card"><h2>Oficina Semanario</h2><p>Clave: <b>reconquista2026</b></p><input id="p" type="password" placeholder="Clave"><button onclick="if(document.getElementById('p').value==='reconquista2026'){localStorage.setItem('a','1');location.reload()}else{alert('Clave mal')}">ENTRAR</button></div><div id="panel" class="card" style="display:none"><h2>Bienvenido Mario</h2><p>El botón PUBLICAR ya no se ve desde afuera, solo acá.</p><input id="t" placeholder="Titulo"><textarea id="tx" rows="5" placeholder="Texto"></textarea><button onclick="alert('Nota publicada')">PUBLICAR</button><hr><button onclick="location.href='/'" style="background:green">VER TAPA CON CLIMA</button></div><script>if(localStorage.getItem('a')){document.getElementById('login').style.display='none';document.getElementById('panel').style.display='block'}</script></body></html>
