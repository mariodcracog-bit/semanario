<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel - Semanario</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f2f2;margin:0;padding:15px}
.caja{max-width:600px;margin:auto;background:#fff;padding:20px;border-radius:12px}
h1{color:#1a3a6b;text-align:center}
label{font-weight:bold;display:block;margin-top:15px}
input,textarea{width:100%;padding:12px;margin-top:5px;border:1px solid #ccc;border-radius:8px;font-size:16px;box-sizing:border-box}
textarea{min-height:150px}
button{width:100%;padding:14px;margin-top:15px;background:#1a3a6b;color:#fff;border:0;border-radius:8px;font-size:18px;font-weight:bold}
.borrar{background:#c00}
.noticia{border:1px solid #ddd;padding:10px;border-radius:8px;margin-top:10px}
.noticia img{max-width:100%;border-radius:8px}
.noticia button{background:#c00;padding:8px;font-size:14px}
</style>
</head>
<body>
<div class="caja">
<h1>PANEL SEMANARIO</h1>
<p style="text-align:center">Publicar noticia en la vidriera</p>

<label>Título</label>
<input id="titulo" placeholder="Escriba el título">

<label>Texto / Desarrollo</label>
<textarea id="texto" placeholder="Escriba acá toda la noticia..."></textarea>

<label>Foto</label>
<input type="file" id="foto" accept="image/*">

<button onclick="publicar()">PUBLICAR</button>

<h2>Noticias publicadas</h2>
<div id="lista"></div>
<button class="borrar" onclick="borrarTodo()">BORRAR TODO</button>
<p style="text-align:center"><a href="../index.html">Ver vidriera</a></p>
</div>

<script>
let fotoBase="";
document.getElementById('foto').addEventListener('change',function(e){
let r=new FileReader();
r.onload=function(){fotoBase=r.result};
r.readAsDataURL(e.target.files[0]);
});
function cargar(){
let n=JSON.parse(localStorage.getItem('semanario_noticias')||'[]');
let h='';
n.forEach((x,i)=>{
h+='<div class="noticia"><b>'+x.titulo+'</b><p>'+x.texto+'</p>'+(x.foto?'<img src="'+x.foto+'">':'')+'<button onclick="borrarUna('+i+')">Borrar esta</button></div>';
});
document.getElementById('lista').innerHTML=h||'Todavía no hay noticias';
}
function publicar(){
let t=document.getElementById('titulo').value;
let x=document.getElementById('texto').value;
if(!t||!x){alert('Falta título o texto');return;}
let n=JSON.parse(localStorage.getItem('semanario_noticias')||'[]');
n.unshift({titulo:t,texto:x,foto:fotoBase,fecha:new Date().toLocaleDateString()});
localStorage.setItem('semanario_noticias',JSON.stringify(n));
document.getElementById('titulo').value='';
document.getElementById('texto').value='';
fotoBase='';
alert('¡Publicado!');
cargar();
}
function borrarUna(i){
let n=JSON.parse(localStorage.getItem('semanario_noticias')||'[]');
n.splice(i,1);
localStorage.setItem('semanario_noticias',JSON.stringify(n));
cargar();
}
function borrarTodo(){
if(!confirm('¿Borrar todo?'))return;
localStorage.removeItem('semanario_noticias');
cargar();
}
cargar();
</script>
</body>
</html>
