<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clasificados - Semanario</title>
<style>
body{font-family:Arial,sans-serif;margin:0;text-align:center}
.titulo{background:#c1272d;color:white;padding:15px;font-size:24px;font-weight:bold;border-radius:10px;margin:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 15px}
button{border:2px solid #c1272d;background:white;color:#c1272d;padding:18px 5px;font-size:18px;font-weight:bold;border-radius:12px}
button.activo{background:#c1272d;color:white}
#lista{padding:20px;text-align:left}
.aviso{border:1px solid #ddd;border-radius:10px;padding:12px;margin-bottom:12px}
</style>
</head>
<body>
<h1>SEMANARIO</h1>
<div class="titulo">AVISOS CLASIFICADOS</div>
<div class="grid" id="categorias"></div>
<p>Apreta una categoria para ver los avisos.</p>
<div id="lista"></div>
<a href="index.html">Volver al inicio</a>
<script>
const cats=["Propiedades","Alquileres","Autos","Motos","Camiones y Maquinas","Empleos","Servicios","Mascotas","Varios","Agro"];
const grid=document.getElementById("categorias");
const lista=document.getElementById("lista");
function mostrar(cat){
document.querySelectorAll("#categorias button").forEach(b=>b.classList.toggle("activo",b.textContent===cat));
const todos=JSON.parse(localStorage.getItem("clasificados")||"[]");
const f=todos.filter(a=>a.categoria===cat);
if(!f.length){lista.innerHTML="<p>Sin avisos en "+cat+"</p>";return;}
lista.innerHTML=f.map(a=>"<div class='aviso'><b>"+a.titulo+"</b><br>"+a.texto+"</div>").join("");
}
cats.forEach(c=>{const b=document.createElement("button");b.textContent=c;b.onclick=()=>mostrar(c);grid.appendChild(b);});
</script>
</body>
</html>
