<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clasificados - Semanario</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#fff}
.header{background:#c62828;color:#fff;text-align:center;padding:20px;font-size:28px;font-weight:bold}
.publicar{display:block;margin:15px;text-align:center;background:#c62828;color:#fff;padding:14px;border-radius:10px;text-decoration:none;font-size:20px;font-weight:bold}
.botones{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.boton{padding:16px;border:2px solid #c62828;background:#fff;color:#c62828;border-radius:12px;font-size:19px;font-weight:bold;cursor:pointer}
.boton.activo{background:#c62828;color:#fff}
#lista{padding:15px}
.aviso{border:1px solid #ddd;border-radius:12px;padding:12px;margin-bottom:12px}
.aviso img{width:100%;border-radius:10px}
.aviso h3{margin:8px 0 4px}
.precio{color:#c62828;font-weight:bold;font-size:20px}
.volver{display:block;text-align:center;margin:20px;color:#5b2ea6;font-size:19px}
</style>
</head>
<body>
<div class="header">📢 CLASIFICADOS</div>
<a class="publicar" href="publicar-clasificado.html">+ PUBLICAR AVISO</a>
<div class="botones" id="botones"></div>
<div id="lista">Cargando avisos...</div>
<a class="volver" href="index.html">Volver al inicio</a>
<script>
const cats=["Todos","Propiedades","Alquileres","Autos","Motos","Camiones y Maquinas","Empleos","Servicios","Mascotas","Varios","Agro"];
let todos=[];let actual="Todos";
const divBot=document.getElementById("botones");
cats.forEach(c=>{
const b=document.createElement("button");
b.className="boton"+(c==="Todos"?" activo":"");
b.textContent=c;
b.onclick=()=>{actual=c;document.querySelectorAll(".boton").forEach(x=>x.classList.remove("activo"));b.classList.add("activo");mostrar();};
divBot.appendChild(b);});
async function cargar(){try{const r=await fetch("/api/clasificados");todos=await r.json();}catch(e){todos=[];}mostrar();}
function mostrar(){
const lista=document.getElementById("lista");
const filtrados=actual==="Todos"?todos:todos.filter(a=>(a.categoria||"Varios")===actual);
if(!filtrados.length){lista.innerHTML="<p style='text-align:center;font-size:19px'>Sin avisos en "+actual+"</p>";return;}
lista.innerHTML=filtrados.map(a=>`<div class="aviso">${a.foto?`<img src="${a.foto}">`:""}<h3>${a.titulo||""}</h3><p>${a.descripcion||""}</p><div class="precio">${a.precio?"$ "+a.precio:""}</div><p>📞 ${a.telefono||""} - ${a.localidad||""}</p></div>`).join("");}
cargar();
</script>
</body>
</html>
