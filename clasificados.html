<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clasificados - Semanario</title>
<style>
body{font-family:Arial,sans-serif;margin:0;padding:10px;background:#fff}
.header{text-align:center;padding:10px}
.menu{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:15px 0}
.menu a{text-decoration:none;color:#d32f2f;border:1.5px solid #d32f2f;padding:8px 14px;border-radius:20px;font-size:14px;font-weight:bold}
.titulo{text-align:center;background:#d32f2f;color:#fff;padding:15px;font-size:22px;font-weight:bold;margin:15px 0;border-radius:8px}
.categorias{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:5px}
.cat-btn{background:#fff;border:2px solid #d32f2f;color:#d32f2f;padding:18px 10px;font-size:16px;font-weight:bold;border-radius:10px}
.contenido{text-align:center;padding:25px 10px;font-size:17px;color:#333}
.volver{display:block;text-align:center;margin:20px;color:#d32f2f;font-weight:bold;text-decoration:none}
</style>
</head>
<body>
<div class="header"><h1>SEMANARIO</h1><p>PERIODISMO QUE INFORMA, INSPIRA Y CONECTA A LA COMUNIDAD</p></div>
<div class="menu"><a href="index.html">Todos</a><a href="index.html">Nacionales</a><a href="index.html">Internacionales</a><a href="index.html">Regionales</a><a href="index.html">Locales</a><a href="index.html">Policiales</a><a href="index.html">Deporte</a></div>
<div class="titulo">AVISOS CLASIFICADOS</div>
<div class="categorias">
<button class="cat-btn" onclick="mostrar('Propiedades')">Propiedades</button>
<button class="cat-btn" onclick="mostrar('Alquileres')">Alquileres</button>
<button class="cat-btn" onclick="mostrar('Autos')">Autos</button>
<button class="cat-btn" onclick="mostrar('Motos')">Motos</button>
<button class="cat-btn" onclick="mostrar('Camiones y Maquinas')">Camiones y Maquinas</button>
<button class="cat-btn" onclick="mostrar('Empleos')">Empleos</button>
<button class="cat-btn" onclick="mostrar('Servicios')">Servicios</button>
<button class="cat-btn" onclick="mostrar('Mascotas')">Mascotas</button>
<button class="cat-btn" onclick="mostrar('Varios')">Varios</button>
<button class="cat-btn" onclick="mostrar('Agro')">Agro</button>
</div>
<div class="contenido" id="resultado">Apreta una categoria para ver los avisos.</div>
<a class="volver" href="index.html">Volver al diario</a>
<script>
function mostrar(c){document.getElementById('resultado').innerHTML='<b>'+c+'</b><br><br>Todavia no hay avisos en esta categoria';}
</script>
</body>
</html>
