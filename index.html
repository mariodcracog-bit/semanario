<!doctype html><html lang=es><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>SD SEMANARIO DIGITAL</title><style>body{margin:0;font-family:Arial;background:#f0f0f0}header{background:#900;color:#fff;padding:8px;text-align:center}.btns{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:6px}.btns button{border:0;background:#fff;color:#900;padding:6px 10px;border-radius:12px;font-weight:bold}main{max-width:800px;margin:auto;padding:10px}.card{background:#fff;padding:12px;margin-bottom:10px;border-radius:8px;box-shadow:0 1px 3px #0002}.card img{width:100%;border-radius:6px;margin-top:8px;max-height:500px;object-fit:cover}.cat{background:#900;color:#fff;padding:2px 8px;border-radius:10px;font-size:12px}</style><header><div style="font-size:24px;font-weight:bold">SD SEMANARIO DIGITAL</div><div>Reconquista y el Mundo</div><div class=btns><button onclick="M('INICIO')">INICIO</button><button onclick="M('LOCALES')">Locales</button><button onclick="M('NACIONALES')">Nacionales</button><button onclick="M('INTERNACIONALES')">Inter</button><button onclick="M('DEPORTES')">Deportes</button><button onclick="M('POLICIALES')">Policiales</button></div></header><main id=main></main><script>let cat='INICIO';function M(c){cat=c;R()}function R(){let n=[];try{n=JSON.parse(localStorage.getItem("semanario_noticias")||"[]")}catch(e){}let m=document.getElementById("main");m.innerHTML="";let f=cat=='INICIO'?n:n.filter(x=>x.categoria==cat);if(f.length==0){m.innerHTML='<div class=card><h3>Bienvenido a su Semanario Digital</h3><p>Toque arriba para ver noticias. Publique en admin.html</p></div>';return}f.forEach(o=>{let d=document.createElement("div");d.className="card";d.innerHTML='<span class=cat>'+o.categoria+'</span> <small>'+(o.fecha||'')+'</small><h3>'+o.titulo+'</h3><p>'+o.texto.replace(/\n/g,'<br>')+'</p>'+(o.foto?'<img src="'+o.foto+'">':'');m.appendChild(d)})}R()</script>
