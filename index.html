<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SD Semanario Digital</title><style>body{margin:0;font-family:Arial;background:#eee}header{background:#b91c1c;color:#fff;padding:10px;text-align:center;position:sticky;top:0}h1{margin:0;font-size:22px}.menu{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}.menu button{border:0;border-radius:20px;padding:8px 14px;font-weight:700;background:#fff;color:#b91c1c}.menu button.active{background:#222;color:#fff}.info{font-size:12px;display:flex;justify-content:space-between;padding:8px 10px}.card{background:#fff;margin:10px;border-radius:12px;padding:14px;box-shadow:0 2px 3px #0002}.tag{background:#b91c1c;color:#fff;padding:3px 8px;border-radius:10px;font-size:12px}.historia{border-left:5px solid #b91c1c;background:#fffbe6}</style></head><body><header><h1>SD SEMANARIO DIGITAL</h1><div>Reconquista y el Mundo</div><div class="menu"><button class="active" onclick="filtrar('INICIO')">INICIO</button><button onclick="filtrar('Locales')">Locales</button><button onclick="filtrar('Nacionales')">Nacionales</button><button onclick="filtrar('Inter')">Inter</button><button onclick="filtrar('Deportes')">Deportes</button><button onclick="filtrar('Policiales')">Policiales</button></div><div class="info"><span id="fecha"></span><span id="clima">Reconquista 26C</span></div></header><div id="contenido"></div><script>let filtro='INICIO';document.getElementById('fecha').textContent=new Date().toLocaleDateString('es-AR');function filtrar(c){filtro=c;var bs=document.querySelectorAll('.menu button');for(var i=0;i<bs.length;i++){bs[i].classList.toggle('active',bs[i].textContent===c);}render();}function render(){var div=document.getElementById('contenido');var notas=[];try{notas=JSON.parse(localStorage.getItem('semanario_noticias')||'[]');}catch(e){}var html='';var f=[];if(filtro==='INICIO'){f=notas;}else{for(var i=0;i<notas.length;i++){if(notas[i].cat===filtro){f.push(notas[i]);}}}if(f.length===0&&filtro==='INICIO'){html+='<div class="card"><p>Estoy en periodo de prueba, por eso que edito contenido pero despues surge un problema se borra todo. Cuando no haya mas errores voy a empezar a publicar. Ademas tengo que hacer todo yo solo para crear este diario, como decia un amigo espanol. Si no lo haces tu no lo hago yo no lo hace nadie. Es asi de facil gente.</p><small>2/11/2026</small></div>';}for(var j=0;j<f.length;j++){html+='<div class="card"><span class="tag">'+f[j].cat+'</span><h3>'+f[j].titulo+'</h3><p style="white-space:pre-line">'+f[j].texto+'</p><small>'+f[j].fecha+'</small></div>';}html+='<div class="card historia"><h3>Nuestra Historia - Reconquista</h3><p>Fundada el 27 de abril de 1872 por el Coronel Manuel Obligado. Capital del Norte Santafesino. Esta historia es FIJA y no se borra nunca.</p></div>';div.innerHTML=html;}render();fetch('https://api.open-meteo.com/v1/forecast?latitude=-29.14&longitude=-59.64&current=temperature_2m&timezone=America/Argentina/Buenos_Aires').then(function(r){return r.json();}).then(function(d){document.getElementById('clima').textContent='Reconquista '+Math.round(d.current.temperature_2m)+'C';}).catch(function(){});</script></body></html>
