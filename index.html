<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Semanario Reconquista</title><style>body{margin:0;font-family:sans-serif}header{background:#c00;color:white;padding:20px;text-align:center}article{background:white;margin:15px;padding:15px;border-radius:8px}h2{color:#c00}</style></head><body><header><h1>SEMANARIO</h1><p>Reconquista - Santa Fe</p><a href="/admin.html" style="color:yellow">Ir al Admin</a></header><div id="lista"></div><script>async function cargar(){let r=await fetch('/noticias.json');let noticias=[];try{noticias=await r.json();}catch(e){}let div=document.getElementById('lista');if(noticias.length==0)div.innerHTML='<article><h2>Bienvenidos al Semanario Digital!</h2><p>Usa el Admin para publicar.</p></article>';else noticias.forEach(n=>{div.innerHTML+=`<article><h2>${n.titulo}</h2><small>${n.fecha}</small><p>${n.texto}</p></article>`});}cargar();</script></body></html>
