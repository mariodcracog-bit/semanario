<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Reconquista y el Mundo</title><style>body{margin:0;font-family:Arial;background:#f5f5f5}.header{background:#b91c1c;color:white;padding:10px}.top{display:flex;justify-content:space-between}.clima{background:white;color:#b91c1c;padding:6px 12px;border-radius:20px;font-weight:bold}.historia{background:#fff8dc;border:2px solid #b91c1c;margin:12px;padding:12px;border-radius:12px}.nota{background:white;margin:12px;padding:12px;border-radius:12px}</style></head><body><div class="header"><div class="top"><div id="clima" class="clima">📍 Reconquista --°C</div><div id="fecha"></div></div><h1 style="text-align:center">Reconquista y el Mundo</h1></div><div class="historia"><h2>📜 Nuestra Historia</h2><p>Fundada el 27 de abril de 1872. Cuna del Norte Santafesino. Esta sección es FIJA y no se borra.</p></div><div class="nota"><h3>Prueba:</h3><p>Con esta versión el botón PUBLICAR no se ve desde afuera, solo en /admin con clave reconquista2026.</p></div><script>document.getElementById('fecha').textContent=new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});fetch('https://api.open-meteo.com/v1/forecast?latitude=-29.14&longitude=-59.64&current=temperature_2m&timezone=America/Argentina/Buenos_Aires').then(r=>r.json()).then(d=>{document.getElementById('clima').textContent='📍 Reconquista '+Math.round(d.current.temperature_2m)+'°C ☀️'})</script></body></html>
