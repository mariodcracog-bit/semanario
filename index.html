<!DOCTYPE html> 
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEMANARIO - Reconquista</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f4f4f4}
header{background:#b91c1c;color:#fff;padding:14px;text-align:center}
header h1{margin:0;font-size:28px}header p{margin:2px 0 0}
.nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:10px;background:#fff}
.nav button{border:1px solid #ddd;background:#eee;padding:8px 12px;border-radius:20px;cursor:pointer}
.nav button.active{background:#b91c1c;color:#fff}
main{max-width:800px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.badge{display:inline-block;background:#b91c1c;color:#fff;font-size:12px;padding:3px 8px;border-radius:10px}
.admin-btn{display:block;text-align:center;margin:10px auto;padding:10px;background:#111;color:#fff;border-radius:8px;text-decoration:none;max-width:800px}
input,select,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:8px;font-size:16px}
textarea{min-height:120px}.pub{background:#b91c1c;color:#fff;border:0;padding:12px;border-radius:8px;font-size:17px;width:100%;cursor:pointer}
.del{background:#eee;border:0;padding:6px 10px;border-radius:6px;cursor:pointer}
.hidden{display:none}
</style></head>
<body>
<header><h1>📰 SEMANARIO</h1><p>Reconquista - Santa Fe - 25/11/2026</p></header>
<div id="publico">
<div class="nav" id="filtros"></div>
<main id="lista"></main>
<a class="admin-btn" href="#" onclick="mostrarAdmin();return false;">🔒 Ir al Admin</a>
</div>
<div id="admin" class="hidden">
<main><div class="card"><h2>SEMANARIO - ADMIN</h2>
<label>Título</label><input id="titulo" placeholder="Título">
<label>Categoría</label><select id="cat"><option>Locales</option><option>Regionales</option><option>Internacionales</option><option>Policiales</option><option>Deporte</option><option>Lenguaje</option><option>Videos</option></select>
<label>Texto</label><textarea id="texto" placeholder="Escribí la noticia"></textarea>
<button class="pub" onclick="publicar()">✅ PUBLICAR NOTICIA</button>
<p><a href="#" onclick="mostrarPublico();return false;">← Volver al diario</a></p></div>
<div class="card"><h3>Lo publicado</h3><div id="publicadas"></div></div>
</main></div>
<script>
const KEY="semanario_noticias_v1";
const CATS=["Todos","Locales","Regionales","Internacionales","Policiales","Deporte","Lenguaje","Videos"];
let filtro="Todos";
function leer(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
function guardar(n){localStorage.setItem(KEY,JSON.stringify(n))}
function mostrarPublico(){document.getElementById('admin').classList.add('hidden');document.getElementById('publico').classList.remove('hidden');render();}
function mostrarAdmin(){document.getElementById('publico').classList.add('hidden');document.getElementById('admin').classList.remove('hidden');renderAdmin();}
function render(){
 const f=document.getElementById('filtros');f.innerHTML="";
 CATS.forEach(c=>{const b=document.createElement('button');b.textContent=c;b.className=c===filtro?'active':'';b.onclick=()=>{filtro=c;render()};f.appendChild(b)});
 const lista=document.getElementById('lista');
 const notas=leer().filter(n=>filtro==="Todos"||n.cat===filtro);
 if(!notas.length){lista.innerHTML='<div class="card"><b>No hay noticias en esta sección todavía</b><p>Publicá una desde el Admin.</p></div>';return}
 lista.innerHTML=notas.map(n=>`<div class="card"><span class="badge">${n.cat}</span><h2>${n.titulo}</h2><p>${n.texto}</p><small>${n.fecha}</small></div>`).join('');
}
function renderAdmin(){
 const d=document.getElementById('publicadas');const notas=leer();
 d.innerHTML=notas.length?notas.map((n,i)=>`<div style="border-top:1px solid #eee;padding:8px 0"><b>${n.cat} - ${n.titulo}</b><br>${n.texto}<br><small>${n.fecha}</small> <button class="del" onclick="borrar(${i})">Borrar</button></div>`).join(''):'<p>Todavía no publicaste nada.</p>';
}
function publicar(){
 const t=document.getElementById('titulo').value.trim();
 const x=document.getElementById('texto').value.trim();
 const c=document.getElementById('cat').value;
 if(!t){alert('Falta el Título');return}
 if(!x){alert('Falta el Texto');return}
 const notas=leer();notas.unshift({titulo:t,texto:x,cat:c,fecha:new Date().toLocaleString('es-AR')});guardar(notas);
 document.getElementById('titulo').value='';document.getElementById('texto').value='';
 renderAdmin();alert('¡Publicado! Ahora se ve en el diario.');mostrarPublico();
}
function borrar(i){if(confirm('¿Borrar esta noticia?')){const n=leer();n.splice(i,1);guardar(n);renderAdmin();render();}}
render();
</script></body></html>
