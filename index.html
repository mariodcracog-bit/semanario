<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semanario - Reconquista</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f2f2f2}
header{background:#1a3a6b;color:#fff;padding:20px;text-align:center}
header h1{margin:0;font-size:30px}
header p{margin:5px 0 0}
.filtros{display:flex;gap:8px;overflow-x:auto;padding:12px;background:#fff;position:sticky;top:0}
.filtros button{white-space:nowrap;padding:10px 14px;border:1px solid #1a3a6b;background:#fff;color:#1a3a6b;border-radius:20px;font-weight:bold}
.filtros button.activo{background:#1a3a6b;color:#fff}
.cont{max-width:800px;margin:auto;padding:12px}
.seccion-titulo{background:#1a3a6b;color:#fff;padding:10px 14px;border-radius:8px;margin:20px 0 10px}
.tarjeta{background:#fff;border-radius:12px;overflow:hidden;margin-bottom:15px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.tarjeta img{width:100%;display:block}
.tarjeta .cuerpo{padding:14px}
.tarjeta h2{margin:0 0 8px;color:#1a3a6b}
.tarjeta p{white-space:pre-line;line-height:1.5}
.etiqueta{display:inline-block;background:#ffcc00;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:bold;margin-bottom:8px}
.vacio{text-align:center;padding:30px;background:#fff;border-radius:12px}
footer{text-align:center;padding:20px;color:#666}
</style>
</head>
<body>
<header>
<h1>SEMANARIO</h1>
<p>Reconquista - Santa Fe - Noticias de la región</p>
</header>
  <!-- CLIMA RECONQUISTA -->
<div id="clima" style="background:#00A8E8;color:white;text-align:center;padding:12px;border-radius:12px;margin:10px;font-family:sans-serif">
  <b>Reconquista, Santa Fe - Cargando clima...</b>
</div>
<script>
fetch('https://api.open-meteo.com/v1/forecast?latitude=-29.14&longitude=-59.64&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=America/Argentina/Buenos_Aires')
.then(r=>r.json()).then(d=>{
  let t = d.current.temperature_2m;
  let h = d.current.relative_humidity_2m;
  let v = d.current.wind_speed_10m;
  document.getElementById('clima').innerHTML = '<b>Reconquista, Santa Fe - ' + t + '° - Humedad ' + h + '% - Viento ' + v + ' km/h</b><br><small>Tocá para ver pronóstico completo</small>';
});
</script>
<!-- FIN CLIMA -->
<div class="filtros" id="filtros"></div>
<div class="cont" id="contenido"></div>
<footer>Semanario Reconquista - Actualizado al día</footer>
<script>
let secciones=["Todas","Local","Nacionales","Internacionales","Policiales","Deportes","Publicidad Local","Avisos Clasificados"];
let actual="Todas";
function botones(){
let h="";
secciones.forEach(s=>{
h+='<button class="'+(s===actual?'activo':'')+'" onclick="filtrar(\''+s+'\')">'+s+'</button>';
});
document.getElementById('filtros').innerHTML=h;
}
function filtrar(s){actual=s;botones();mostrar();}
function mostrar(){
let n=JSON.parse(localStorage.getItem('semanario_noticias')||'[]');
let c=document.getElementById('contenido');
if(n.length===0){
c.innerHTML='<div class="vacio"><h2>Todavía no hay noticias publicadas</h2><p>En breve vas a ver acá las noticias del Semanario.</p></div>';
return;
}
let filtradas = actual==="Todas" ? n : n.filter(x=>(x.seccion||'Local')===actual);
if(filtradas.length===0){
c.innerHTML='<div class="vacio"><h2>No hay noticias en '+actual+'</h2><p>Probá con otra sección.</p></div>';
return;
}
let h="";
if(actual==="Todas"){
secciones.slice(1).forEach(sec=>{
let deEsta=n.filter(x=>(x.seccion||'Local')===sec);
if(deEsta.length===0) return;
h+='<div class="seccion-titulo">'+sec+'</div>';
deEsta.forEach(x=>{
h+='<div class="tarjeta">'+(x.foto?'<img src="'+x.foto+'">':'')+'<div class="cuerpo"><span class="etiqueta">'+(x.seccion||'Local')+'</span><h2>'+x.titulo+'</h2><p>'+x.texto+'</p><small>'+(x.fecha||'')+'</small></div></div>';
});
});
}else{
filtradas.forEach(x=>{
h+='<div class="tarjeta">'+(x.foto?'<img src="'+x.foto+'">':'')+'<div class="cuerpo"><span class="etiqueta">'+(x.seccion||'Local')+'</span><h2>'+x.titulo+'</h2><p>'+x.texto+'</p><small>'+(x.fecha||'')+'</small></div></div>';
});
}
c.innerHTML=h;
}
botones();
mostrar();
</script>
</body>
</html>
