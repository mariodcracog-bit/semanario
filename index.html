<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SD SEMANARIO DIGITAL - Reconquista y el Mundo</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#fff}
header{background:#fff;border-bottom:4px solid #b91c1c;padding:15px;text-align:center}
header h1{margin:0;font-size:30px} header h1 span{background:#b91c1c;color:#fff;padding:2px 8px}
nav{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;background:#fff;padding:10px}
nav button{padding:8px 12px;font-weight:bold;border:none;cursor:pointer;background:#e5e7eb}
nav button.activo{background:#b91c1c;color:#fff}
.grandes{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px}
.grandes button{padding:12px 16px;font-weight:bold;border:none;border-radius:8px;font-size:15px}
.card{max-width:800px;margin:12px auto;padding:15px;border:1px solid #eee;border-radius:8px}
.card img{width:100%;border-radius:8px}
.bajada{font-style:italic;border-left:4px solid #b91c1c;padding-left:10px;color:#444}
.form{max-width:800px;margin:15px auto;background:#f9fafb;padding:15px;border-radius:8px}
input,select,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
.btn{width:100%;background:#b91c1c;color:#fff;padding:14px;font-weight:bold;border:none;border-radius:8px;font-size:17px}
.etiqueta{background:#b91c1c;color:#fff;padding:3px 8px;font-size:12px;border-radius:4px}
.pub{background:#fef9c3;border:2px dashed #eab308;padding:15px;text-align:center;margin:12px auto;max-width:800px;border-radius:8px}
</style>
</head>
<body>
<header><h1><span>SD</span> SEMANARIO DIGITAL</h1><p>Noticias de Reconquista, la región y el mundo</p></header>
<div class="pub">PUBLICIDAD SUPERIOR 728x90 - Tu publicidad aquí</div>
<nav id="menu"></nav>
<div class="grandes">


<button onclick="filtrar('Avisos Clasificados')" style="background:#16a34a;color:white">📋 AVISOS CLASIFICADOS</button>
</div>
<div class="form">
<h2>Publicar nueva noticia</h2>
<input id="titulo" placeholder="Título de la nota">
<textarea id="bajada" placeholder="Bajada / Resumen en 1 o 2 líneas"></textarea>
<select id="categoria"><option>Locales</option><option>Regionales</option><option>Deportes</option><option>Fotografías</option><option>Internacionales</option><option>Publicidad Local</option><option>Avisos Clasificados</option></select>
<input type="file" id="fotoInput" accept="image/*"><p id="vistaFoto" style="font-size:13px;color:green"></p>
<textarea id="intro" placeholder="Introducción"></textarea>
<textarea id="desarrollo" placeholder="Desarrollo"></textarea>
<textarea id="conclusion" placeholder="Conclusión"></textarea>
<button class="btn" onclick="publicar()">PUBLICAR AHORA</button>
<p style="text-align:center;font-size:13px">Esto NO borra lo anterior. Se suma a lo que ya está publicado.</p>
</div>
<div id="lista"></div>
<script>
const CATS=["INICIO","Locales","Regionales","Deportes","Internacionales","Avisos Clasificados"];
let filtro="INICIO"; let fotoBase64="";
const menu=document.getElementById('menu');
CATS.forEach(c=>{let b=document.createElement('button');b.innerText=c;b.onclick=()=>filtrar(c);if(c===filtro)b.classList.add('activo');menu.appendChild(b);});
function filtrar(c){filtro=c;[...menu.children].forEach(b=>b.classList.toggle('activo',b.innerText===c));mostrar();}
document.getElementById('fotoInput').addEventListener('change',function(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{fotoBase64=r.result;document.getElementById('vistaFoto').innerText="✅ Foto lista";};r.readAsDataURL(f);});
function getNoticias(){return JSON.parse(localStorage.getItem('semanario-digital-noticias')||'[]');}
function mostrar(){let noticias=getNoticias();let f=filtro==="INICIO"?noticias:noticias.filter(n=>n.categoria===filtro);let div=document.getElementById('lista');if(f.length===0){div.innerHTML="<p style='text-align:center'>Todavía no hay noticias en "+filtro+". Publique arriba.</p>";return;}div.innerHTML=f.map(n=>`<div class="card"><span class="etiqueta">${n.categoria}</span> <small>${n.fecha||''}</small><h2>${n.titulo}</h2><p class="bajada">${n.bajada||''}</p>${n.foto?`<img src="${n.foto}">`:''}<p><b>Introducción:</b> ${n.introduccion||''}</p><p><b>Desarrollo:</b> ${n.desarrollo||''}</p><p><b>Conclusión:</b> ${n.conclusion||''}</p></div>`).join('');}
function publicar(){let n={id:Date.now(),titulo:document.getElementById('titulo').value,bajada:document.getElementById('bajada').value,categoria:document.getElementById('categoria').value,foto:fotoBase64,introduccion:document.getElementById('intro').value,desarrollo:document.getElementById('desarrollo').value,conclusion:document.getElementById('conclusion').value,fecha:new Date().toLocaleDateString('es-AR')};if(!n.titulo){alert('Ponga el título primero');return;}let prev=getNoticias();prev.unshift(n);localStorage.setItem('semanario-digital-noticias',JSON.stringify(prev));alert('¡Publicado en '+n.categoria+'!');mostrar();}
mostrar();
</script>
</body>
</html>
