<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Semanario</title>
<style>
body{font-family:Arial;padding:15px;background:#f5f5f5}
input,textarea,select{width:100%;padding:10px;margin:6px 0;box-sizing:border-box}
button{padding:10px 20px;background:#a00;color:white;border:none;border-radius:6px;font-weight:bold}
.card{background:white;padding:10px;margin:8px 0;border-radius:8px}
</style>
</head>
<body>
  <script>if(prompt("Clave de Mario:")!=="Mario1960"){document.body.innerHTML="<h2>Acceso denegado</h2>";throw new Error("x");}</script>
<h2>ADMIN Semanario Digital</h2>
<input id="titulo" placeholder="Titulo de la noticia">
<select id="categoria"><option>Locales</option><option>Nacionales</option><option>Inter</option><option>Deportes</option><option>Policiales</option></select>
<textarea id="texto" rows="6" placeholder="Escriba el texto de la noticia aqui..."></textarea>
<button onclick="publicar()">PUBLICAR NOTICIA</button>
<button onclick="borrarTodo()" style="background:#333;margin-left:10px">Borrar todo y mostrar solo Historia</button>
<div id="lista"></div>
<script>
const KEY='noticias_semanario';
function cargar(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}
function guardar(a){localStorage.setItem(KEY,JSON.stringify(a));localStorage.setItem('noticias',JSON.stringify(a))}
function publicar(){let t=document.getElementById('titulo').value;let tx=document.getElementById('texto').value;let c=document.getElementById('categoria').value;if(!t||!tx){alert('Falta titulo o texto');return}let a=cargar();a.unshift({titulo:t,texto:tx,categoria:c,fecha:new Date().toLocaleDateString()});guardar(a);document.getElementById('titulo').value='';document.getElementById('texto').value='';mostrar();alert('Noticia publicada! Ahora vaya a la pagina principal')}
function borrar(id){let a=cargar();a.splice(id,1);guardar(a);mostrar()}
function borrarTodo(){if(confirm('Borra todo y deja solo la Historia?')){localStorage.removeItem(KEY);localStorage.removeItem('noticias');mostrar();alert('Ahora solo se vera la Historia fija')}}
function mostrar(){let a=cargar();let d=document.getElementById('lista');if(a.length==0){d.innerHTML='<p>No hay noticias guardadas. Se vera la Historia fija en la pagina principal.</p>';return}d.innerHTML=a.map((n,i)=>`<div class="card"><b>${n.titulo}</b> - ${n.categoria}<br><small>${n.fecha}</small><p>${n.texto.substring(0,120)}...</p><button onclick="borrar(${i})">Borrar esta</button></div>`).join('')}
window.onload=mostrar;
</script>
</body>
</html>
