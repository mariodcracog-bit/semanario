<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>ADMIN</title><style>body{font:16px Arial;padding:10px;max-width:600px;margin:auto}.b{display:flex;flex-wrap:wrap;gap:4px;background:#900;padding:6px}.b button{border:0;background:#fff;padding:6px 10px;border-radius:12px}.s{background:yellow!important}input,textarea{width:100%;padding:8px;box-sizing:border-box;margin-top:8px;border:1px solid #999}img{max-width:100%}</style><h3>ADMIN con FOTOS</h3><div class=b><button id=INICIO class=s onclick="c='INICIO';S()">INICIO</button><button id=LOCALES onclick="c='LOCALES';S()">LOCALES</button><button id=NACIONALES onclick="c='NACIONALES';S()">NACIONALES</button><button id=INTERNACIONALES onclick="c='INTERNACIONALES';S()">INTER</button><button id=DEPORTES onclick="c='DEPORTES';S()">DEPORTES</button><button id=POLICIALES onclick="c='POLICIALES';S()">POLICIALES</button></div><input id=t placeholder=TITULO><textarea id=x placeholder=NOTICIA rows=4></textarea><input type=file id=f accept="image/*"><button onclick="P()" style="background:#c00;color:#fff;width:100%;padding:12px;margin-top:8px;border:0;font-weight:bold">PUBLICAR CON FOTO</button><script>c="INICIO";function S(){document.querySelectorAll(".b button").forEach(b=>b.classList.remove("s"));document.getElementById(c).classList.add("s")}function save(foto){let a=t.value.trim(),b=x.value.trim();if(!a||!b){alert("Escriba titulo y noticia");return}let n=[];try{n=JSON.parse(localStorage.getItem("semanario_noticias")||"[]")}catch(e){}n.unshift({titulo:a,categoria:c,texto:b,foto:foto,fecha:new Date().toLocaleString()});localStorage.setItem("semanario_noticias",JSON.stringify(n));alert("Publicado en "+c+" con foto!");t.value="";x.value="";document.getElementById("f").value=""}function P(){let file=document.getElementById("f").files[0];if(file){let r=new FileReader();r.onload=e=>save(e.target.result);r.readAsDataURL(file)}else{save(null)}}</script>
