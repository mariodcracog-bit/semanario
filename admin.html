<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Semanario</title><style>body{font-family:sans-serif;padding:15px;background:#f2f2f2}h1{color:#c00}input,textarea{width:100%;padding:12px;margin:8px 0;font-size:18px}button{width:100%;padding:15px;background:#c00;color:white;font-size:20px;border:none}</style></head><body><h1>ADMIN - Semanario Reconquista</h1><p>Aca publicas vos, Mario.</p><input id="titulo" placeholder="Titulo de la noticia"><textarea id="texto" rows="6" placeholder="Escribi la noticia aca..."></textarea><button onclick="publicar()">PUBLICAR AHORA</button><p id="aviso"></p><script>async function publicar(){let t=document.getElementById('titulo').value;let x=document.getElementById('texto').value;if(!t||!x){alert('Falta titulo o texto');return;}await fetch('/guardar',{method:'POST',body:JSON.stringify({titulo:t,texto:x,fecha:new Date().toLocaleString()})});document.getElementById('aviso').innerHTML='¡Publicado!';document.getElementById('titulo').value='';document.getElementById('texto').value='';}</script></body></html>
