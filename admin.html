<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Admin</title><style>body{font-family:system-ui;padding:12px;background:#f5f5f5}.card{background:#fff;padding:14px;border-radius:10px;margin-bottom:12px}input,textarea,select{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:8px}button{padding:12px;border:0;border-radius:8px;font-weight:bold}.btn-green{background:#16a34a;color:#fff;width:100%}.btn-red{background:#dc2626;color:#fff}.lista-noticia{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}</style></head><body><h2>Admin Semanario</h2><div class="card"><h3>Nueva</h3><input id="titulo" placeholder="Titulo"><textarea id="contenido" placeholder="Texto"></textarea><input id="imagen" placeholder="URL imagen"><select id="categoria"><option>Locales</option><option>Policiales</option><option>Deportes</option></select><button class="btn-green" onclick="guardar()">PUBLICAR</button></div><div class="card"><h3>Noticias - BORRAR solo 1</h3><div id="lista">Cargando...</div></div><script>let noticias=[];async function cargar(){try{let r=await fetch('/noticias.json?t='+Date.now());noticias=await r.json()}catch(e){noticias=JSON.parse(localStorage.getItem('noticias_local')||'[]')}render()}function render(){let c=document.getElementById('lista');if(noticias.length==0){c.innerHTML='No hay';return}c.innerHTML=noticias.map((n,i)=>`<div class="lista-noticia"><div><b>${n.titulo||''}</b></div><button class="btn-red" onclick="borrarUna(${i})">BORRAR ESTA</button></div>`).join('')}async function guardar(){let nueva={id:Date.now(),titulo:titulo.value,contenido:contenido.value,imagen:imagen.value,categoria:categoria.value,fecha:new Date().toISOString()};try{await fetch('/api/noticias',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(nueva)})}catch(e){}noticias.unshift(nueva);localStorage.setItem('noticias_local',JSON.stringify(noticias));render()}async function borrarUna(i){let n=noticias[i];if(!confirm('Borrar '+n.titulo+'?'))return;try{await fetch('/api/noticias?id='+n.id,{method:'DELETE'})}catch(e){}noticias.splice(i,1);localStorage.setItem('noticias_local',JSON.stringify(noticias));render()}cargar()</script></body></html>
